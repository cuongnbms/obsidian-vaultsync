name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: server (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the versions pinned in mise.toml, the same ones used locally.
      - uses: jdx/mise-action@v2
      - name: gofmt
        working-directory: server
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        working-directory: server
        run: go vet ./...
      # The harness from spec §9: every scenario checks that no version of the
      # text disappeared quietly. A red test here means a data loss bug.
      - name: test
        working-directory: server
        run: go test -race ./...
      - name: build
        working-directory: server
        run: CGO_ENABLED=0 go build ./...

  plugin:
    name: plugin (typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - name: types
        run: pnpm run check
      # The integration tests drive the real engine against a real server, so the
      # binary has to exist first. Everything that has gone wrong so far went wrong
      # between the pieces rather than inside one of them.
      - name: build server for integration tests
        run: make server
      - name: tests
        run: pnpm test
      - run: pnpm run build

  image:
    name: container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Built but not pushed, so a broken Dockerfile is caught on the commit that
      # breaks it rather than on the release that needed it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
